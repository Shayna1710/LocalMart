{% extends 'base.html' %}{% block title %}Account · LocalMart{% endblock %}{% block content %}<section class="page-title"><span class="eyebrow">MY ACCOUNT</span><h1>Account center</h1><p>Manage your profile and shopping activity.</p></section><section class="account-layout"><form method="post" action="{{url_for('update_account')}}" class="checkout-card"><h2>Profile</h2><label>Full name<input name="name" value="{{user.name}}" required></label><label>Email<input value="{{user.email}}" disabled></label><button class="btn">Save profile</button></form><div class="account-stats"><div><span>Orders</span><b>{{stats.orders}}</b><a href="{{url_for('orders')}}">View orders →</a></div><div><span>Total spent</span><b>₹{{'%.2f'|format(stats.spent|float)}}</b><a href="{{url_for('wishlist')}}">View wishlist →</a></div></div></section>{% endblock %}
